<!-- block content -->
<section class="container post" id="component-content">
    <article>
        <header>
            {% if config.theme.components and config.theme.components.title == False %}
            {% else %}
                <h1 class="{{ config.theme.title_style }} title" id="component-title">{{ page.title }}</h1>
            {% endif %}
        </header>
        <p>{{ page.content }}</p>
    </article>

    {% if (page and page.meta.blog_list) or (config.theme.components and config.theme.components.blog_list) %}
    {% include "modules/blog_list.html" %}
    {% endif %}
</section>
<!-- endblock -->
